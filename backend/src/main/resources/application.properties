spring.application.name=cashflow-guardian-backend
server.port=8080

# PostgreSQL Configuration (Local or Cloud / Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cashflow_guardian}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Security & JWT Configuration
cashflow.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d0e2b4a6c8e0d2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c}
cashflow.jwt.expiration-ms=86400000

# Google Gemini AI Integration
# Pass your Gemini API key via environment variable: GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
